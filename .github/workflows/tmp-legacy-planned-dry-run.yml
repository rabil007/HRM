name: Temporary Legacy Planned Dry-Run

# One-off production inspection only. Do NOT add --apply.
# Safe to delete after the dry-run report is captured.
on:
  push:
    branches:
      - cursor/prod-legacy-planned-dry-run-a9d9
    paths:
      - '.github/workflows/tmp-legacy-planned-dry-run.yml'
  workflow_dispatch:

concurrency:
  group: tmp-legacy-planned-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '[82.198.227.207]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyse96dUeLo4oKa76H8AfK4q4/RHbHMcxt+1GZRGaI9' >> ~/.ssh/known_hosts

      - name: Test SSH connectivity
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SSH connectivity check attempt $attempt/3..."
            if timeout 15 bash -c '</dev/tcp/82.198.227.207/65002'; then
              echo "SSH port 82.198.227.207:65002 is reachable."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "ERROR: Cannot reach 82.198.227.207:65002"
          exit 1

      - name: Confirm production commit and run all-companies dry-run only
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes u769441461@82.198.227.207 'bash -s' << 'EOF'
            set -euo pipefail
            cd ~/domains/overseas-ms.com/public_html/hrm

            echo "===== PRODUCTION REVISION ====="
            echo "git HEAD: $(git rev-parse HEAD)"
            echo "git log: $(git log -1 --oneline)"
            if [ -f storage/app/deploy/revision.sha ]; then
              echo "deploy stamp: $(tr -d '[:space:]' < storage/app/deploy/revision.sha)"
            else
              echo "deploy stamp: MISSING"
            fi

            REQUIRED_SHA='ee9a29554581094599743e4739884a7e82b33b75'
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" != "$REQUIRED_SHA" ]; then
              echo "ERROR: Production HEAD $CURRENT_SHA does not match required tip $REQUIRED_SHA"
              echo "Refusing to run migration against unexpected revision."
              exit 1
            fi
            echo "Production matches required tip $REQUIRED_SHA."

            echo "===== BEFORE GLOBAL COUNTS ====="
            php artisan tinker --execute="
              echo 'planned_assignments_total=' . App\Models\CrewAssignment::query()->where('status', App\Enums\CrewAssignmentStatus::Planned)->count() . PHP_EOL;
              echo 'crew_assignments_count=' . App\Models\CrewAssignment::query()->count() . PHP_EOL;
              echo 'crew_assignment_phases_count=' . App\Models\CrewAssignmentPhase::query()->count() . PHP_EOL;
              echo 'crew_planning_assignments_count=' . App\Models\CrewPlanningAssignment::query()->count() . PHP_EOL;
              echo 'employee_sea_services_count=' . App\Models\EmployeeSeaService::query()->count() . PHP_EOL;
              echo 'payroll_work_allocations_count=' . App\Models\PayrollWorkAllocation::query()->count() . PHP_EOL;
              echo 'crew_assignments_max_updated=' . (string) (App\Models\CrewAssignment::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'crew_assignment_phases_max_updated=' . (string) (App\Models\CrewAssignmentPhase::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'crew_planning_max_updated=' . (string) (App\Models\CrewPlanningAssignment::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'sea_services_max_updated=' . (string) (App\Models\EmployeeSeaService::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'payroll_alloc_max_updated=' . (string) (App\Models\PayrollWorkAllocation::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'activity_log_count=' . Spatie\Activitylog\Models\Activity::query()->count() . PHP_EOL;
              echo 'activity_log_max_id=' . (string) (Spatie\Activitylog\Models\Activity::query()->max('id') ?? 'null') . PHP_EOL;
            "

            echo "===== SQL BEFORE: planned by company ====="
            php artisan tinker --execute="
              \$rows = Illuminate\Support\Facades\DB::select(\"SELECT company_id, COUNT(*) AS planned_count FROM crew_assignments WHERE status = 'planned' GROUP BY company_id ORDER BY company_id\");
              if (\$rows === []) {
                echo \"(no rows)\\n\";
              } else {
                foreach (\$rows as \$row) {
                  echo 'company_id=' . \$row->company_id . ' planned_count=' . \$row->planned_count . PHP_EOL;
                }
              }
              \$total = Illuminate\Support\Facades\DB::selectOne(\"SELECT COUNT(*) AS total_planned FROM crew_assignments WHERE status = 'planned'\");
              echo 'total_planned=' . \$total->total_planned . PHP_EOL;
            "

            echo "===== DRY-RUN COMMAND ====="
            echo "php artisan crew-planning:migrate-legacy-planned --all-companies"
            echo "(explicitly WITHOUT --apply)"

            echo "===== DRY-RUN OUTPUT BEGIN ====="
            php artisan crew-planning:migrate-legacy-planned --all-companies
            echo "===== DRY-RUN OUTPUT END ====="

            echo "===== SQL AFTER: planned by company ====="
            php artisan tinker --execute="
              \$rows = Illuminate\Support\Facades\DB::select(\"SELECT company_id, COUNT(*) AS planned_count FROM crew_assignments WHERE status = 'planned' GROUP BY company_id ORDER BY company_id\");
              if (\$rows === []) {
                echo \"(no rows)\\n\";
              } else {
                foreach (\$rows as \$row) {
                  echo 'company_id=' . \$row->company_id . ' planned_count=' . \$row->planned_count . PHP_EOL;
                }
              }
              \$total = Illuminate\Support\Facades\DB::selectOne(\"SELECT COUNT(*) AS total_planned FROM crew_assignments WHERE status = 'planned'\");
              echo 'total_planned=' . \$total->total_planned . PHP_EOL;
            "

            echo "===== AFTER GLOBAL COUNTS ====="
            php artisan tinker --execute="
              echo 'planned_assignments_total=' . App\Models\CrewAssignment::query()->where('status', App\Enums\CrewAssignmentStatus::Planned)->count() . PHP_EOL;
              echo 'crew_assignments_count=' . App\Models\CrewAssignment::query()->count() . PHP_EOL;
              echo 'crew_assignment_phases_count=' . App\Models\CrewAssignmentPhase::query()->count() . PHP_EOL;
              echo 'crew_planning_assignments_count=' . App\Models\CrewPlanningAssignment::query()->count() . PHP_EOL;
              echo 'employee_sea_services_count=' . App\Models\EmployeeSeaService::query()->count() . PHP_EOL;
              echo 'payroll_work_allocations_count=' . App\Models\PayrollWorkAllocation::query()->count() . PHP_EOL;
              echo 'crew_assignments_max_updated=' . (string) (App\Models\CrewAssignment::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'crew_assignment_phases_max_updated=' . (string) (App\Models\CrewAssignmentPhase::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'crew_planning_max_updated=' . (string) (App\Models\CrewPlanningAssignment::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'sea_services_max_updated=' . (string) (App\Models\EmployeeSeaService::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'payroll_alloc_max_updated=' . (string) (App\Models\PayrollWorkAllocation::query()->max('updated_at') ?? 'null') . PHP_EOL;
              echo 'activity_log_count=' . Spatie\Activitylog\Models\Activity::query()->count() . PHP_EOL;
              echo 'activity_log_max_id=' . (string) (Spatie\Activitylog\Models\Activity::query()->max('id') ?? 'null') . PHP_EOL;
            "

            echo "===== DONE (all-companies inspection only; no --apply) ====="
          EOF
