name: Temporary Legacy Planned Dry-Run

# One-off production inspection only. Do NOT add --apply.
# Safe to delete after the dry-run report is captured.
on:
  push:
    branches:
      - cursor/prod-legacy-planned-dry-run-a9d9
    paths:
      - '.github/workflows/tmp-legacy-planned-dry-run.yml'
  workflow_dispatch:

concurrency:
  group: tmp-legacy-planned-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '[82.198.227.207]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyse96dUeLo4oKa76H8AfK4q4/RHbHMcxt+1GZRGaI9' >> ~/.ssh/known_hosts

      - name: Test SSH connectivity
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SSH connectivity check attempt $attempt/3..."
            if timeout 15 bash -c '</dev/tcp/82.198.227.207/65002'; then
              echo "SSH port 82.198.227.207:65002 is reachable."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "ERROR: Cannot reach 82.198.227.207:65002"
          exit 1

      - name: Inspect planned rows including soft-deletes
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes u769441461@82.198.227.207 'bash -s' << 'EOF'
            set -euo pipefail
            cd ~/domains/overseas-ms.com/public_html/hrm

            echo "===== PRODUCTION REVISION ====="
            echo "git HEAD: $(git rev-parse HEAD)"
            echo "deploy stamp: $(tr -d '[:space:]' < storage/app/deploy/revision.sha 2>/dev/null || echo MISSING)"

            echo "===== LIVE ELOQUENT PLANNED (default scope) ====="
            php artisan tinker --execute="
              echo 'live_planned=' . App\Models\CrewAssignment::query()->where('status', App\Enums\CrewAssignmentStatus::Planned)->count() . PHP_EOL;
            "

            echo "===== WITH TRASHED ELOQUENT PLANNED ====="
            php artisan tinker --execute="
              echo 'with_trashed_planned=' . App\Models\CrewAssignment::withTrashed()->where('status', App\Enums\CrewAssignmentStatus::Planned)->count() . PHP_EOL;
              echo 'only_trashed_planned=' . App\Models\CrewAssignment::onlyTrashed()->where('status', App\Enums\CrewAssignmentStatus::Planned)->count() . PHP_EOL;
            "

            echo "===== SQL RAW PLANNED ROWS (no deleted_at filter) ====="
            php artisan tinker --execute="
              \$rows = Illuminate\Support\Facades\DB::select(\"
                SELECT id, company_id, assignment_no, employee_id, vessel_id, position_id, status, deleted_at, created_at, updated_at
                FROM crew_assignments
                WHERE status = 'planned'
                ORDER BY company_id, id
              \");
              echo 'raw_planned_rows=' . count(\$rows) . PHP_EOL;
              foreach (\$rows as \$row) {
                echo json_encode(\$row, JSON_UNESCAPED_SLASHES) . PHP_EOL;
              }
              \$total = Illuminate\Support\Facades\DB::selectOne(\"SELECT COUNT(*) AS total_planned FROM crew_assignments WHERE status = 'planned'\");
              echo 'total_planned=' . \$total->total_planned . PHP_EOL;
              \$live = Illuminate\Support\Facades\DB::selectOne(\"SELECT COUNT(*) AS live_planned FROM crew_assignments WHERE status = 'planned' AND deleted_at IS NULL\");
              echo 'live_planned_sql=' . \$live->live_planned . PHP_EOL;
            "

            echo "===== CANDIDATE DETAILS (withTrashed planned) ====="
            php artisan tinker --execute="
              \$assignments = App\Models\CrewAssignment::withTrashed()
                ->with(['employee:id,name', 'vessel:id,name', 'position:id,title'])
                ->where('status', App\Enums\CrewAssignmentStatus::Planned)
                ->orderBy('company_id')
                ->orderBy('id')
                ->get();
              foreach (\$assignments as \$a) {
                echo json_encode([
                  'company_id' => \$a->company_id,
                  'assignment_id' => \$a->id,
                  'assignment_no' => \$a->assignment_no,
                  'employee' => \$a->employee?->name,
                  'vessel' => \$a->vessel?->name,
                  'position' => \$a->position?->title,
                  'status' => \$a->status?->value,
                  'deleted_at' => optional(\$a->deleted_at)?->toDateTimeString(),
                  'migration_status' => \$a->trashed() ? 'soft_deleted_out_of_scope' : 'live',
                  'disposition' => \$a->trashed() ? 'not_scanned_by_phase4_migrator' : 'would_be_scanned',
                  'blockers' => \$a->trashed() ? ['soft_deleted'] : [],
                ], JSON_UNESCAPED_SLASHES) . PHP_EOL;
              }
            "

            echo "===== DRY-RUN ALL COMPANIES (no --apply) ====="
            php artisan crew-planning:migrate-legacy-planned --all-companies

            echo "===== DONE ====="
          EOF
