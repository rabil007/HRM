name: Monthly Crew Formatter Preview
on:
  push:
    branches:
      - fix/monthly-crew-contract-compensation-eos

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preview formatted frontend files (read only)
        run: |
          node_modules/.bin/prettier --write resources/js/features/organization/contracts/contracts-content.tsx resources/js/features/organization/contracts/contracts-import-dialog.tsx resources/js/features/organization/contracts/contracts-show-content.tsx resources/js/features/organization/contracts/contracts-table-row.tsx resources/js/features/organization/contracts/employee-contract-salary-revisions.tsx resources/js/features/payroll/components/office-payroll-records-table.tsx resources/js/pages/organization/_components/employee-contract-tab.tsx
          node - <<'NODE'
          const fs = require('fs');
          const files = ["resources/js/features/organization/contracts/contracts-content.tsx","resources/js/features/organization/contracts/contracts-import-dialog.tsx","resources/js/features/organization/contracts/contracts-show-content.tsx","resources/js/features/organization/contracts/contracts-table-row.tsx","resources/js/features/organization/contracts/employee-contract-salary-revisions.tsx","resources/js/features/payroll/components/office-payroll-records-table.tsx","resources/js/pages/organization/_components/employee-contract-tab.tsx"];
          for (const file of files) {
            console.log('FORMAT_FILE_B64 ' + file + ' ' + fs.readFileSync(file).toString('base64'));
          }
          NODE
