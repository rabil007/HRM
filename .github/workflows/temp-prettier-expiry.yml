name: Temporary Prettier Expiry Fix

on:
  push:
    branches:
      - codex/prettier-expiry-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/prettier-expiry-fix
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/js/pages/settings/email-templates.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet -- resources/js/pages/settings/email-templates.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/settings/email-templates.tsx
          git commit -m "style: format email template settings"
          git push origin HEAD:codex/prettier-expiry-fix
