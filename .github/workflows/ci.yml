name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  PEST_SHARD_TOTAL: 6
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  VITE_BUILD_ARTIFACT: vite-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pint: ${{ steps.classify.outputs.pint }}
      frontend_static: ${{ steps.classify.outputs.frontend_static }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      pest: ${{ steps.classify.outputs.pest }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Classify CI scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          collect_changed_files() {
            local from_ref="$1"
            local to_ref="$2"

            # Disable rename detection so a rename is delete+add and both
            # paths are classified (e.g. app/Foo.php -> docs/Foo.md).
            git -c diff.renames=false diff --name-only "$from_ref" "$to_ref" | sed '/^$/d'
          }

          detection_failed=false
          changed_files=()

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ -z "${PR_BASE_SHA:-}" || -z "${PR_HEAD_SHA:-}" || "$PR_BASE_SHA" =~ ^0+$ || "$PR_HEAD_SHA" =~ ^0+$ ]]; then
              echo "Missing PR base/head SHA; fail-safe full CI."
              detection_failed=true
            elif ! merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null)"; then
              echo "Unable to determine merge-base of ${PR_BASE_SHA} and ${PR_HEAD_SHA}; fail-safe full CI."
              detection_failed=true
            else
              echo "PR classify: base=${PR_BASE_SHA} head=${PR_HEAD_SHA} merge-base=${merge_base}"
              mapfile -t changed_files < <(collect_changed_files "$merge_base" "$PR_HEAD_SHA")
            fi
          else
            if [[ -z "${PUSH_BEFORE:-}" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo "Missing or zero push before SHA; fail-safe full CI."
              detection_failed=true
            else
              echo "Push classify: before=${PUSH_BEFORE} sha=${PUSH_SHA}"
              mapfile -t changed_files < <(collect_changed_files "$PUSH_BEFORE" "$PUSH_SHA")
            fi
          fi

          if [[ "$detection_failed" == 'true' ]]; then
            php .github/scripts/ci.php classify --fail-safe
            exit 0
          fi

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No changed files detected; fail-safe full CI."
            php .github/scripts/ci.php classify --fail-safe
            exit 0
          fi

          echo "Changed files (${#changed_files[@]}):"
          printf '  - %s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" | php .github/scripts/ci.php classify --paths-file=-

  pint:
    name: PHP Style (Pint)
    needs: changes
    if: needs.changes.outputs.pint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache Pint
        uses: actions/cache@v4
        with:
          path: .pint.cache
          key: pint-${{ runner.os }}-${{ hashFiles('composer.lock', 'pint.json') }}-${{ github.sha }}
          restore-keys: |
            pint-${{ runner.os }}-${{ hashFiles('composer.lock', 'pint.json') }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint
        run: composer lint:check -- --cache-file=.pint.cache

  frontend_static:
    name: Frontend Static
    needs: changes
    if: needs.changes.outputs.frontend_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*') }}-

      - name: Cache Prettier
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc*') }}-

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run parallel frontend checks
        run: |
          set -uo pipefail

          mkdir -p node_modules/.cache

          npx eslint . --cache --cache-strategy content --cache-location node_modules/.cache/.eslintcache > /tmp/eslint.log 2>&1 & pid_eslint=$!
          npx prettier --check resources/ --cache --cache-strategy content > /tmp/prettier.log 2>&1 & pid_prettier=$!
          npm run types:check > /tmp/types.log 2>&1 & pid_types=$!
          npm run test:frontend > /tmp/frontend-test.log 2>&1 & pid_test=$!

          status_eslint=0; wait $pid_eslint || status_eslint=$?
          status_prettier=0; wait $pid_prettier || status_prettier=$?
          status_types=0; wait $pid_types || status_types=$?
          status_test=0; wait $pid_test || status_test=$?

          echo "::group::ESLint ($( [ "${status_eslint:-0}" -eq 0 ] && echo 'PASSED' || echo 'FAILED' ))"
          cat /tmp/eslint.log
          echo "::endgroup::"

          echo "::group::Prettier ($( [ "${status_prettier:-0}" -eq 0 ] && echo 'PASSED' || echo 'FAILED' ))"
          cat /tmp/prettier.log
          echo "::endgroup::"

          echo "::group::TypeScript ($( [ "${status_types:-0}" -eq 0 ] && echo 'PASSED' || echo 'FAILED' ))"
          cat /tmp/types.log
          echo "::endgroup::"

          echo "::group::Frontend Unit Tests ($( [ "${status_test:-0}" -eq 0 ] && echo 'PASSED' || echo 'FAILED' ))"
          cat /tmp/frontend-test.log
          echo "::endgroup::"

          rm -f /tmp/eslint.log /tmp/prettier.log /tmp/types.log /tmp/frontend-test.log

          if [[ ${status_eslint:-0} -ne 0 || ${status_prettier:-0} -ne 0 || ${status_types:-0} -ne 0 || ${status_test:-0} -ne 0 ]]; then
            echo "One or more frontend checks failed: eslint=${status_eslint}, prettier=${status_prettier}, types=${status_types}, tests=${status_test}"
            exit 1
          fi

  frontend_build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Production build
        run: npm run build

      - name: Record Vite build metadata
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          {
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
          } > ci-vite-build-meta

      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}
          path: |
            public/build
            ci-vite-build-meta
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Vite build marker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}-meta
          path: ci-vite-build-meta
          if-no-files-found: error
          retention-days: 7

  pest:
    name: Pest ${{ matrix.shard }}/6
    needs:
      - changes
    if: needs.changes.outputs.pest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pest shard ${{ matrix.shard }}/6
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(php .github/scripts/ci.php pest-shard --shard="$SHARD" --total="${PEST_SHARD_TOTAL}")
          echo "Running ${#TEST_FILES[@]} test files on shard ${SHARD}/${PEST_SHARD_TOTAL}."
          php artisan test --compact --ansi "${TEST_FILES[@]}"

  quality:
    name: Quality gates
    needs:
      - changes
      - pint
      - frontend_static
      - frontend_build
      - pest
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PINT_RESULT: ${{ needs.pint.result }}
          FRONTEND_STATIC_RESULT: ${{ needs.frontend_static.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend_build.result }}
          PEST_RESULT: ${{ needs.pest.result }}
          RUN_PINT: ${{ needs.changes.outputs.pint }}
          RUN_FRONTEND_STATIC: ${{ needs.changes.outputs.frontend_static }}
          RUN_FRONTEND_BUILD: ${{ needs.changes.outputs.frontend_build }}
          RUN_PEST: ${{ needs.changes.outputs.pest }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          set -euo pipefail

          echo "scope=${SCOPE}"
          echo "docs_only=${DOCS_ONLY}"
          echo "run_pint=${RUN_PINT} pint_result=${PINT_RESULT}"
          echo "run_frontend_static=${RUN_FRONTEND_STATIC} frontend_static_result=${FRONTEND_STATIC_RESULT}"
          echo "run_frontend_build=${RUN_FRONTEND_BUILD} frontend_build_result=${FRONTEND_BUILD_RESULT}"
          echo "run_pest=${RUN_PEST} pest_result=${PEST_RESULT}"
          echo "changes_result=${CHANGES_RESULT}"

          if [[ "${CHANGES_RESULT}" != 'success' ]]; then
            echo "::error::Change detection failed; refusing to pass the CI gate (result=${CHANGES_RESULT})."
            exit 1
          fi

          failed=false

          check_job() {
            local label="$1"
            local should_run="$2"
            local result="$3"

            if [[ "${should_run}" == 'true' ]]; then
              if [[ "${result}" != 'success' ]]; then
                echo "::error::${label} did not succeed (result=${result})."
                failed=true
              fi
            else
              if [[ "${result}" != 'skipped' ]]; then
                echo "::error::${label} was expected to be skipped (result=${result})."
                failed=true
              fi
            fi
          }

          check_job "PHP Style (Pint)" "${RUN_PINT}" "${PINT_RESULT}"
          check_job "Frontend Static" "${RUN_FRONTEND_STATIC}" "${FRONTEND_STATIC_RESULT}"
          check_job "Frontend Build" "${RUN_FRONTEND_BUILD}" "${FRONTEND_BUILD_RESULT}"
          check_job "Pest" "${RUN_PEST}" "${PEST_RESULT}"

          if [[ "${failed}" == 'true' ]]; then
            exit 1
          fi

          if [[ "${DOCS_ONLY}" == 'true' ]]; then
            echo "Docs-only changes detected; application install/test jobs were skipped."
          fi

          echo "CI gate passed (scope=${SCOPE})."
