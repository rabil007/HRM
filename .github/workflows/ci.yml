name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'bootstrap/**'
              - 'database/**'
              - 'routes/**'
              - 'tests/**'
              - 'artisan'
              - 'phpunit.xml'
              - 'pint.json'
              - '**/*.php'
            frontend:
              - 'resources/js/**'
              - 'resources/css/**'
              - 'vite.config.*'
              - 'tsconfig.json'
              - 'eslint.config.*'
              - '.prettierrc'
              - '.prettierrc.*'
              - '.prettierignore'
              - '.npmrc'
              - 'components.json'
              - '**/*.{js,jsx,mjs,cjs,ts,tsx,css,scss}'
            shared:
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'config/**'
              - '.env.example'
              - '.github/**'
              - 'public/**'
              - 'resources/views/**'
              - 'resources/cv-templates/**'
              - '.editorconfig'
              - '.gitattributes'
              - '.gitignore'
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.cursor/**'
              - '.agents/**'
              - '.gemini/**'
              - '.cursorignore'
              - '.cursorindexingignore'
              - 'boost.json'

      - name: Classify CI scope
        id: classify
        run: |
          backend='${{ steps.filter.outputs.backend }}'
          frontend='${{ steps.filter.outputs.frontend }}'
          shared='${{ steps.filter.outputs.shared }}'
          docs='${{ steps.filter.outputs.docs }}'

          run_backend=false
          run_frontend=false
          docs_only=false
          scope=full

          # Shared/config/dependency/high-risk → full CI.
          # Unknown (no filter matched) → fail-safe full CI.
          if [[ "$shared" == 'true' ]] || {
            [[ "$backend" != 'true' && "$frontend" != 'true' && "$docs" != 'true' ]]
          }; then
            run_backend=true
            run_frontend=true
            scope=full
          elif [[ "$backend" == 'true' && "$frontend" == 'true' ]]; then
            run_backend=true
            run_frontend=true
            scope=full
          elif [[ "$backend" == 'true' ]]; then
            run_backend=true
            scope=backend
          elif [[ "$frontend" == 'true' ]]; then
            run_frontend=true
            scope=frontend
          else
            docs_only=true
            scope=docs-only
          fi

          {
            echo "backend=${run_backend}"
            echo "frontend=${run_frontend}"
            echo "docs_only=${docs_only}"
            echo "scope=${scope}"
          } >> "$GITHUB_OUTPUT"

          echo "Filter backend=${backend} frontend=${frontend} shared=${shared} docs=${docs}"
          echo "CI scope=${scope} run_backend=${run_backend} run_frontend=${run_frontend} docs_only=${docs_only}"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Log runtime versions
        run: php --version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pint
        run: composer lint:check

      - name: Pest
        run: php artisan test --compact --ansi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Log runtime versions
        run: |
          node --version
          npm --version
          php --version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.4-

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check

      - name: Frontend tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

  quality:
    name: Quality gates
    needs:
      - changes
      - backend
      - frontend
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate CI result
        run: |
          changes_result='${{ needs.changes.result }}'
          backend_result='${{ needs.backend.result }}'
          frontend_result='${{ needs.frontend.result }}'
          run_backend='${{ needs.changes.outputs.backend }}'
          run_frontend='${{ needs.changes.outputs.frontend }}'
          docs_only='${{ needs.changes.outputs.docs_only }}'
          scope='${{ needs.changes.outputs.scope }}'

          echo "scope=${scope}"
          echo "docs_only=${docs_only}"
          echo "run_backend=${run_backend} backend_result=${backend_result}"
          echo "run_frontend=${run_frontend} frontend_result=${frontend_result}"
          echo "changes_result=${changes_result}"

          if [[ "$changes_result" != 'success' ]]; then
            echo '::error::Change detection failed; refusing to pass the CI gate.'
            exit 1
          fi

          if [[ "$run_backend" == 'true' ]]; then
            if [[ "$backend_result" != 'success' ]]; then
              echo "::error::Backend checks did not succeed (result=${backend_result})."
              exit 1
            fi
          elif [[ "$backend_result" != 'skipped' ]]; then
            echo "::error::Backend job was expected to be skipped (result=${backend_result})."
            exit 1
          fi

          if [[ "$run_frontend" == 'true' ]]; then
            if [[ "$frontend_result" != 'success' ]]; then
              echo "::error::Frontend checks did not succeed (result=${frontend_result})."
              exit 1
            fi
          elif [[ "$frontend_result" != 'skipped' ]]; then
            echo "::error::Frontend job was expected to be skipped (result=${frontend_result})."
            exit 1
          fi

          if [[ "$docs_only" == 'true' ]]; then
            echo 'Docs-only changes detected; application install/test jobs were skipped.'
          fi

          echo "CI gate passed (scope=${scope})."
