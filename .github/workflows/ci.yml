name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  PEST_SHARD_TOTAL: 3
  VITE_BUILD_ARTIFACT: vite-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pint: ${{ steps.classify.outputs.pint }}
      frontend_static: ${{ steps.classify.outputs.frontend_static }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      pest: ${{ steps.classify.outputs.pest }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Classify CI scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          collect_changed_files() {
            local from_ref="$1"
            local to_ref="$2"

            # Disable rename detection so a rename is delete+add and both
            # paths are classified (e.g. app/Foo.php -> docs/Foo.md).
            git -c diff.renames=false diff --name-only "$from_ref" "$to_ref" | sed '/^$/d'
          }

          detection_failed=false
          changed_files=()

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ -z "${PR_BASE_SHA:-}" || -z "${PR_HEAD_SHA:-}" || "$PR_BASE_SHA" =~ ^0+$ || "$PR_HEAD_SHA" =~ ^0+$ ]]; then
              echo "Missing PR base/head SHA; fail-safe full CI."
              detection_failed=true
            elif ! merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null)"; then
              echo "Unable to determine merge-base of ${PR_BASE_SHA} and ${PR_HEAD_SHA}; fail-safe full CI."
              detection_failed=true
            else
              echo "PR classify: base=${PR_BASE_SHA} head=${PR_HEAD_SHA} merge-base=${merge_base}"
              mapfile -t changed_files < <(collect_changed_files "$merge_base" "$PR_HEAD_SHA")
            fi
          else
            if [[ -z "${PUSH_BEFORE:-}" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo "Missing or zero push before SHA; fail-safe full CI."
              detection_failed=true
            else
              echo "Push classify: before=${PUSH_BEFORE} sha=${PUSH_SHA}"
              mapfile -t changed_files < <(collect_changed_files "$PUSH_BEFORE" "$PUSH_SHA")
            fi
          fi

          if [[ "$detection_failed" == 'true' ]]; then
            php .github/scripts/ci.php classify --fail-safe
            exit 0
          fi

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No changed files detected; fail-safe full CI."
            php .github/scripts/ci.php classify --fail-safe
            exit 0
          fi

          echo "Changed files (${#changed_files[@]}):"
          printf '  - %s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" | php .github/scripts/ci.php classify --paths-file=-

  pint:
    name: PHP Style (Pint)
    needs: changes
    if: needs.changes.outputs.pint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint
        run: composer lint:check

  frontend_static:
    name: Frontend Static
    needs: changes
    if: needs.changes.outputs.frontend_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check

      - name: Frontend tests
        run: npm run test:frontend

  frontend_build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Production build
        run: npm run build

      - name: Record Vite build metadata
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          {
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
          } > ci-vite-build-meta

      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}
          path: |
            public/build
            ci-vite-build-meta
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Vite build marker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}-meta
          path: ci-vite-build-meta
          if-no-files-found: error
          retention-days: 7

  pest:
    name: Pest ${{ matrix.shard }}/3
    needs:
      - changes
      - frontend_build
    if: needs.changes.outputs.pest == 'true' && needs.frontend_build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}

      - name: Verify Vite manifest
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          grep -qx "sha=${{ github.sha }}" ci-vite-build-meta
          grep -qx "run_id=${{ github.run_id }}" ci-vite-build-meta
          grep -qx "run_attempt=${{ github.run_attempt }}" ci-vite-build-meta

      - name: Pest shard ${{ matrix.shard }}/3
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(php .github/scripts/ci.php pest-shard --shard="$SHARD" --total="${PEST_SHARD_TOTAL}")
          echo "Running ${#TEST_FILES[@]} test files on shard ${SHARD}/${PEST_SHARD_TOTAL}."
          php artisan test --compact --ansi -- "${TEST_FILES[@]}"

      - name: Record Pest shard completion
        run: |
          set -euo pipefail
          {
            echo "shard=${{ matrix.shard }}"
            echo "sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > "pest-shard-${{ matrix.shard }}.ok"

      - name: Upload Pest shard marker
        uses: actions/upload-artifact@v4
        with:
          name: pest-shard-${{ matrix.shard }}
          path: pest-shard-${{ matrix.shard }}.ok
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Quality gates
    needs:
      - changes
      - pint
      - frontend_static
      - frontend_build
      - pest
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Download Pest shard markers
        if: needs.changes.outputs.pest == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pest-shard-*
          merge-multiple: true
          path: pest-shards

      - name: Download Vite build marker
        if: needs.changes.outputs.frontend_build == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VITE_BUILD_ARTIFACT }}-meta
          path: vite-build-marker

      - name: Evaluate CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PINT_RESULT: ${{ needs.pint.result }}
          FRONTEND_STATIC_RESULT: ${{ needs.frontend_static.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend_build.result }}
          PEST_RESULT: ${{ needs.pest.result }}
          RUN_PINT: ${{ needs.changes.outputs.pint }}
          RUN_FRONTEND_STATIC: ${{ needs.changes.outputs.frontend_static }}
          RUN_FRONTEND_BUILD: ${{ needs.changes.outputs.frontend_build }}
          RUN_PEST: ${{ needs.changes.outputs.pest }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          EXPECTED_PEST_SHARDS: ${{ env.PEST_SHARD_TOTAL }}
        run: |
          set -euo pipefail

          if [[ "${RUN_PEST}" == 'true' && "${PEST_RESULT}" == 'success' ]]; then
            found=""
            for shard in $(seq 1 "${EXPECTED_PEST_SHARDS}"); do
              marker="pest-shards/pest-shard-${shard}.ok"
              if [[ -f "$marker" ]] && grep -qx "sha=${{ github.sha }}" "$marker"; then
                found="${found:+$found,}${shard}"
              fi
            done
            export FOUND_PEST_SHARDS="${found}"
          fi

          if [[ "${RUN_FRONTEND_BUILD}" == 'true' && "${FRONTEND_BUILD_RESULT}" == 'success' ]]; then
            if [[ -f vite-build-marker/ci-vite-build-meta ]] && grep -qx "sha=${{ github.sha }}" vite-build-marker/ci-vite-build-meta; then
              export VITE_BUILD_PRESENT=true
            else
              export VITE_BUILD_PRESENT=false
            fi
          fi

          php .github/scripts/ci.php quality-gates
