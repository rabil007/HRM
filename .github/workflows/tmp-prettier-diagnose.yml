name: Temporary Prettier Diagnose

on:
  push:
    branches:
      - tmp/prettier-document-ai

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format target file
        run: npx prettier --write resources/js/features/organization/documents/configuration/document-ai-settings-card.tsx

      - name: Show exact formatter diff
        run: git diff -- resources/js/features/organization/documents/configuration/document-ai-settings-card.tsx
