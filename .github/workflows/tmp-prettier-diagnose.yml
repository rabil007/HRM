name: Temporary Document AI Verify

on:
  push:
    branches:
      - tmp/prettier-document-ai

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Prettier target
        run: npx prettier --check resources/js/features/organization/documents/configuration/document-ai-settings-card.tsx

      - name: TypeScript
        run: npm run types:check
