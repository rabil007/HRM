name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Check PHP formatting
        run: composer lint:check

      - name: Validate frontend lint without rewriting files
        run: npx eslint . --fix-dry-run

      - name: Check frontend formatting
        run: |
          npx prettier --write resources/js/components/command-menu.tsx resources/js/hooks/use-workspace-shortcuts.ts
          git diff --exit-code -- resources/js/components/command-menu.tsx resources/js/hooks/use-workspace-shortcuts.ts

      - name: Check TypeScript
        run: npm run types:check

      - name: Run frontend tests
        run: npm run test:frontend
