name: Full Deploy (Laravel + React)

# Runs only after the CI workflow succeeds for a push to main.
# Do not cancel this job from the CI concurrency group.
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download CI plan
        uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read CI plan
        id: plan
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid validated SHA format: $VALIDATED_SHA"
            exit 1
          fi

          if [[ ! -f ci-plan.txt ]]; then
            echo "ERROR: CI plan artifact is missing."
            exit 1
          fi

          cat ci-plan.txt

          plan_sha="$(sed -n 's/^sha=//p' ci-plan.txt | head -n 1)"
          plan_run_id="$(sed -n 's/^run_id=//p' ci-plan.txt | head -n 1)"
          deploy_required="$(sed -n 's/^deploy_required=//p' ci-plan.txt | head -n 1)"
          frontend_build_required="$(sed -n 's/^frontend_build_required=//p' ci-plan.txt | head -n 1)"

          if [[ "$plan_sha" != "$VALIDATED_SHA" ]]; then
            echo "ERROR: CI plan SHA ${plan_sha} does not match validated SHA ${VALIDATED_SHA}."
            exit 1
          fi

          if [[ "$plan_run_id" != "$RUN_ID" ]]; then
            echo "ERROR: CI plan run_id ${plan_run_id} does not match workflow_run id ${RUN_ID}."
            exit 1
          fi

          echo "deploy_required=${deploy_required}" >> "$GITHUB_OUTPUT"
          echo "frontend_build_required=${frontend_build_required}" >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy plan"
            echo "- sha: ${VALIDATED_SHA}"
            echo "- deploy_required: ${deploy_required}"
            echo "- frontend_build_required: ${frontend_build_required}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when nothing deployable changed
        if: steps.plan.outputs.deploy_required != 'true'
        run: |
          echo "No deployable application changes."
          echo "No deployable application changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH
        if: steps.plan.outputs.deploy_required == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '[82.198.227.207]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyse96dUeLo4oKa76H8AfK4q4/RHbHMcxt+1GZRGaI9' >> ~/.ssh/known_hosts

      - name: Download CI-validated Vite build
        if: steps.plan.outputs.deploy_required == 'true' && steps.plan.outputs.frontend_build_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: vite-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CI-validated frontend artifact
        if: steps.plan.outputs.deploy_required == 'true' && steps.plan.outputs.frontend_build_required == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! -f ci-vite-build-meta || ! -f public/build/manifest.json ]]; then
            echo "ERROR: Required CI Vite artifact is missing after Frontend Build was required."
            exit 1
          fi

          if ! grep -qx "sha=${VALIDATED_SHA}" ci-vite-build-meta \
            || ! grep -qx "run_id=${{ github.event.workflow_run.id }}" ci-vite-build-meta; then
            echo "ERROR: CI Vite artifact metadata does not match the validated SHA/run."
            cat ci-vite-build-meta
            exit 1
          fi

          echo "Reusing CI-validated Vite build for ${VALIDATED_SHA}."

      - name: Test SSH connectivity
        if: steps.plan.outputs.deploy_required == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "SSH connectivity check attempt $attempt/3..."
            if timeout 15 bash -c '</dev/tcp/82.198.227.207/65002'; then
              echo "SSH port 82.198.227.207:65002 is reachable."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SSH port is not reachable yet; retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "ERROR: Cannot reach 82.198.227.207:65002 from this GitHub Actions runner."
          exit 1

      - name: Upload build to server
        if: steps.plan.outputs.deploy_required == 'true' && steps.plan.outputs.frontend_build_required == 'true'
        env:
          # HRM default. Set repository variable DEPLOY_APP_DIR=cms on OMS-CMS.
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || 'hrm' }}
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes" public/build/ \
            "u769441461@82.198.227.207:~/domains/overseas-ms.com/public_html/${DEPLOY_APP_DIR}/public/build/"

      - name: Deploy Backend
        if: steps.plan.outputs.deploy_required == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          # HRM default. Set repository variable DEPLOY_APP_DIR=cms on OMS-CMS.
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || 'hrm' }}
          # Authenticate private-repo fetch on Hostinger (HTTPS remotes have no stored credentials).
          DEPLOY_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GIT_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid validated SHA format: $VALIDATED_SHA"
            exit 1
          fi

          if [[ ! "$DEPLOY_APP_DIR" =~ ^[a-z0-9_-]+$ ]]; then
            echo "ERROR: Invalid DEPLOY_APP_DIR: $DEPLOY_APP_DIR"
            exit 1
          fi

          if [[ ! "$DEPLOY_GIT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid DEPLOY_GIT_REPO: $DEPLOY_GIT_REPO"
            exit 1
          fi

          if [ -z "$DEPLOY_GIT_TOKEN" ]; then
            echo "ERROR: DEPLOY_GIT_TOKEN is empty"
            exit 1
          fi

          echo "Deploying revision ${VALIDATED_SHA:0:7} ($VALIDATED_SHA) to ${DEPLOY_APP_DIR}..."

          ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes u769441461@82.198.227.207 "bash -s -- \"$VALIDATED_SHA\" \"$DEPLOY_APP_DIR\" \"$DEPLOY_GIT_TOKEN\" \"$DEPLOY_GIT_REPO\"" << 'EOF'
            set -e
            TARGET_SHA="$1"
            APP_DIR="$2"
            GIT_TOKEN="$3"
            GIT_REPO="$4"

            if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "ERROR: Invalid target SHA: $TARGET_SHA"
              exit 1
            fi

            if [[ ! "$APP_DIR" =~ ^[a-z0-9_-]+$ ]]; then
              echo "ERROR: Invalid APP_DIR: $APP_DIR"
              exit 1
            fi

            if [[ ! "$GIT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "ERROR: Invalid GIT_REPO: $GIT_REPO"
              exit 1
            fi

            if [ -z "$GIT_TOKEN" ]; then
              echo "ERROR: GIT_TOKEN is empty"
              exit 1
            fi

            cd ~/domains/overseas-ms.com/public_html/"$APP_DIR" || exit 1

            echo "Fetching and resetting to validated revision ${TARGET_SHA:0:7}..."
            # Do not write credentials into .git/config; fetch the exact SHA from this workflow's repo.
            git fetch --depth 1 "https://x-access-token:${GIT_TOKEN}@github.com/${GIT_REPO}.git" "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

            NODE_BIN=""
            for candidate in $(ls -d /opt/alt/alt-nodejs*/root/usr/bin/node 2>/dev/null | sort -V | tail -1) /usr/local/bin/node /usr/bin/node; do
              if [ -x "$candidate" ]; then
                NODE_BIN="$candidate"
                break
              fi
            done

            if [ -z "$NODE_BIN" ]; then
              echo "ERROR: Node.js not found. Enable Node.js in Hostinger hPanel, then redeploy."
              exit 1
            fi

            export PATH="$(dirname "$NODE_BIN"):$PATH"
            NPM_BIN="$(dirname "$NODE_BIN")/npm"
            if [ ! -x "$NPM_BIN" ]; then
              NPM_BIN="$(command -v npm || true)"
            fi
            if [ -z "$NPM_BIN" ] || [ ! -x "$NPM_BIN" ]; then
              echo "ERROR: npm not found for the selected Node.js runtime. Enable Node.js in Hostinger hPanel, then redeploy."
              exit 1
            fi

            export BROWSERSHOT_NODE_BINARY="$NODE_BIN"
            export BROWSERSHOT_NPM_BINARY="$NPM_BIN"
            export PUPPETEER_CACHE_DIR="$PWD/storage/app/puppeteer"
            mkdir -p "$PUPPETEER_CACHE_DIR"

            LOCK_HASH="$(sha256sum package-lock.json | awk '{print $1}')"
            STAMP_DIR="storage/app/deploy"
            STAMP_FILE="$STAMP_DIR/npm-lock.sha256"
            NEED_NPM=1

            if [ -f "$STAMP_FILE" ] && [ "$(tr -d '[:space:]' < "$STAMP_FILE")" = "$LOCK_HASH" ] \
              && [ -d node_modules/puppeteer ]; then
              if php artisan browsershot:doctor --no-interaction; then
                echo "Production Node/Puppeteer stamp matches package-lock; skipping npm ci."
                NEED_NPM=0
              else
                echo "Browsershot doctor failed; reinstalling Node dependencies."
              fi
            fi

            if [ "$NEED_NPM" = 1 ]; then
              export CI_SKIP_PUPPETEER_BROWSER_INSTALL=1
              npm ci --omit=dev --no-audit --no-fund
              php artisan browsershot:install --no-interaction
              php artisan browsershot:doctor --no-interaction
              mkdir -p "$STAMP_DIR"
              printf '%s\n' "$LOCK_HASH" > "${STAMP_FILE}.tmp"
              mv "${STAMP_FILE}.tmp" "$STAMP_FILE"
            fi

            php artisan migrate --force
            php artisan leave-balances:sync
            php artisan db:seed --class=RequirementEmailTemplatesSeeder --force
            php artisan db:seed --class=PermissionsSeeder --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p "$STAMP_DIR"
            printf '%s\n' "$TARGET_SHA" > "${STAMP_DIR}/revision.sha.tmp"
            mv "${STAMP_DIR}/revision.sha.tmp" "${STAMP_DIR}/revision.sha"

            echo "Deploy complete for ${TARGET_SHA:0:7}."
            echo "If new queue job classes shipped, restart queue workers so they load the new code."
          EOF
