name: Full Deploy (Laravel + React)

# Runs only after the CI workflow succeeds for a push to main.
# Do not cancel this job from the CI concurrency group.
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo '[82.198.227.207]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIyse96dUeLo4oKa76H8AfK4q4/RHbHMcxt+1GZRGaI9' >> ~/.ssh/known_hosts

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download CI-validated Vite build
        id: vite-artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: vite-build-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify or rebuild frontend
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid validated SHA format: $VALIDATED_SHA"
            exit 1
          fi

          if [[ -f ci-vite-build-meta && -f public/build/manifest.json ]] \
            && grep -qx "sha=${VALIDATED_SHA}" ci-vite-build-meta \
            && grep -qx "run_id=${{ github.event.workflow_run.id }}" ci-vite-build-meta; then
            echo "Reusing CI-validated Vite build for ${VALIDATED_SHA}."
            exit 0
          fi

          echo "CI Vite artifact missing or SHA mismatch; rebuilding for ${VALIDATED_SHA}."
          rm -rf public/build ci-vite-build-meta
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Test SSH connectivity
        run: |
          for attempt in 1 2 3; do
            echo "SSH connectivity check attempt $attempt/3..."
            if timeout 15 bash -c '</dev/tcp/82.198.227.207/65002'; then
              echo "SSH port 82.198.227.207:65002 is reachable."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SSH port is not reachable yet; retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "ERROR: Cannot reach 82.198.227.207:65002 from this GitHub Actions runner."
          exit 1

      - name: Upload build to server
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes" public/build/ \
            u769441461@82.198.227.207:~/domains/overseas-ms.com/public_html/hrm/public/build/

      - name: Deploy Backend
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$VALIDATED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid validated SHA format: $VALIDATED_SHA"
            exit 1
          fi

          echo "Deploying revision ${VALIDATED_SHA:0:7} ($VALIDATED_SHA)..."

          ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=yes u769441461@82.198.227.207 "bash -s -- \"$VALIDATED_SHA\"" << 'EOF'
            set -e
            TARGET_SHA="$1"

            if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "ERROR: Invalid target SHA: $TARGET_SHA"
              exit 1
            fi

            cd ~/domains/overseas-ms.com/public_html/hrm || exit 1

            echo "Fetching and resetting to validated revision ${TARGET_SHA:0:7}..."
            git fetch origin
            git reset --hard "$TARGET_SHA"

            composer install --no-dev --optimize-autoloader

            NODE_BIN=""
            for candidate in $(ls -d /opt/alt/alt-nodejs*/root/usr/bin/node 2>/dev/null | sort -V | tail -1) /usr/local/bin/node /usr/bin/node; do
              if [ -x "$candidate" ]; then
                NODE_BIN="$candidate"
                break
              fi
            done

            if [ -z "$NODE_BIN" ]; then
              echo "ERROR: Node.js not found. Enable Node.js in Hostinger hPanel, then redeploy."
              exit 1
            fi

            export PATH="$(dirname "$NODE_BIN"):$PATH"
            export PUPPETEER_CACHE_DIR="$PWD/storage/app/puppeteer"
            mkdir -p "$PUPPETEER_CACHE_DIR"

            npm ci --omit=dev
            php artisan browsershot:install
            php artisan browsershot:doctor

            php artisan migrate --force
            php artisan leave-balances:sync
            php artisan db:seed --class=PermissionsSeeder --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          EOF
